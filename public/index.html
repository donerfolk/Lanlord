<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lanlord">
<title>Lanlord</title>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<!-- use-credentials: the manifest goes through the passcode gate like everything else. -->
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
<meta name="theme-color" content="#eef1f6">
<script>
  // Before first paint, or the page flashes white on a dark phone. A saved choice wins,
  // otherwise follow the OS - the CSS below only knows [data-theme], so there is no
  // prefers-color-scheme block to keep in sync with it.
  (function(){
    var t = 'auto';
    try { t = localStorage.getItem('ls_theme') || 'auto'; } catch (e) {}
    var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.querySelector('meta[name="theme-color"]').content = dark ? '#0d0f14' : '#eef1f6';
  })();
</script>
<!-- Figtree, served from this PC. The page is regularly opened on the PC's mobile
     hotspot with no internet, where a font CDN leaves the whole UI in a fallback face. -->
<style>
  @font-face{
    font-family:'Figtree'; src:url('/fonts/figtree-latin.woff2') format('woff2');
    font-weight:300 800; font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:'Figtree'; src:url('/fonts/figtree-latin-ext.woff2') format('woff2');
    font-weight:300 800; font-display:swap;
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
</style>
<style>
  :root{
    --bg:#eef1f6; --surface:#ffffff; --surface-2:#f9fafc; --text:#0a1220; --muted:#6a7787; --muted-2:#93a0b4;
    --border:#e3e8f0; --border-2:#ebeef4; --accent:#2569d6; --accent-hover:#1d55b3; --accent-text:#ffffff;
    --accent-wash:#e9f1fd; --accent-wash-border:#d3e3fb; --danger:#dc2626;
    --ok-bg:#ecfdf3; --ok-border:#ccf5e0; --ok-dot:#12b76a; --ok-text:#04613b;
    --track:#eef2f8;
    /* Two layers: a hairline contact shadow and a soft ambient one. One huge blur with a big
       negative spread only left a grey smudge under the bottom edge on a light background. */
    --shadow:0 1px 2px rgba(11,18,32,.06), 0 12px 30px -10px rgba(11,18,32,.20);
  }
  /* Set by the script in <head> from the saved choice, or the OS when that's "auto". */
  :root[data-theme="dark"]{
    --bg:#0d0f14; --surface:#161922; --surface-2:#12141c; --text:#f2f4f8; --muted:#9aa4b6; --muted-2:#6b7488;
    --border:#262b38; --border-2:#20242f; --accent:#5ea0f5; --accent-hover:#7db4f8; --accent-text:#08101f;
    --accent-wash:#16263f; --accent-wash-border:#27427a; --danger:#f87171;
    --ok-bg:#0d2419; --ok-border:#16452c; --ok-dot:#2fd480; --ok-text:#5fe3a3;
    --track:#1c2028; --shadow:0 1px 2px rgba(0,0,0,.5), 0 16px 40px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Figtree',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    letter-spacing:-.006em; font-synthesis-weight:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-tap-highlight-color:transparent;
  }
  /* Data, not code: one family throughout, with figures that line up in a column. */
  .mono{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; letter-spacing:0; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent-wash); }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.3 } }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  @keyframes toast-in { from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  a{ color:var(--accent); text-decoration:none; }

  /* ---------- app shell ---------- */
  #app{ display:flex; min-height:100vh; }

  /* Sidebar (desktop) */
  #sidebar{
    width:228px; flex:none; background:var(--surface-2); border-right:1px solid var(--border-2);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:20px 18px 18px; }
  .brand-mark{ width:26px; height:26px; border-radius:9px; background:var(--accent); display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:700; letter-spacing:-.02em; flex:none; }
  .brand-name{ font-size:15px; font-weight:700; letter-spacing:-.025em; }

  .nav{ padding:4px 10px; display:flex; flex-direction:column; gap:4px; }
  .nav-item{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 14px; border-radius:14px; color:var(--muted); font-size:15.5px; font-weight:500; cursor:pointer; border:none; background:none; width:100%; text-align:left; }
  .nav-item:hover{ background:var(--track); }
  .nav-item.active{ background:var(--accent-wash); color:var(--accent-hover); font-weight:600; }
  .nav-item-inner{ display:flex; align-items:center; gap:12px; min-width:0; }
  .nav-icon{ display:flex; flex:none; opacity:.85; }
  .nav-badge{ font-size:13.5px; font-variant-numeric:tabular-nums; color:var(--muted-2); }
  .nav-item.active .nav-badge{ color:var(--accent); }

  /* The online dot on the Devices page. */
  .device-dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .device-dot.on{ background:var(--ok-dot); }
  .device-dot.off{ background:var(--muted-2); opacity:.5; }

  .sidebar-foot{ margin-top:auto; padding:16px 18px 20px; display:flex; flex-direction:column; gap:12px; }
  .disk-card{ border:1px solid var(--border); background:var(--surface); border-radius:16px; padding:13px; }
  .disk-row{ display:flex; justify-content:space-between; align-items:baseline; }
  .disk-label{ font-size:12.5px; color:var(--muted); }
  .disk-val{ font-size:13px; font-weight:600; }
  .meter{ height:5px; border-radius:999px; background:var(--track); margin-top:10px; overflow:hidden; }
  .meter-fill{ height:100%; background:var(--accent); border-radius:999px; transition:width .3s; }
  .reach-note{ font-size:12px; color:var(--muted-2); line-height:1.5; }

  /* Main column */
  #main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:15px 24px; border-bottom:1px solid var(--border-2); flex-wrap:wrap; }
  .search{ flex:1; max-width:360px; min-width:160px; display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:0 13px; }
  .search input{ flex:1; min-width:0; background:transparent; border:none; outline:none; font-family:inherit; font-size:14px; color:var(--text); padding:10px 0; }
  .search input::placeholder{ color:var(--muted-2); }
  .search-ico{ width:12px; height:12px; border:1.5px solid var(--muted-2); border-radius:50%; flex:none; position:relative; }
  .search-ico::after{ content:''; position:absolute; width:5px; height:1.5px; background:var(--muted-2); right:-5px; bottom:-1px; transform:rotate(45deg); }

  .topbar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .conn-pill{ display:flex; align-items:center; gap:8px; background:var(--ok-bg); border:1px solid var(--ok-border); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:500; color:var(--ok-text); white-space:nowrap; }
  .conn-pill .dot{ width:6px; height:6px; border-radius:50%; background:var(--ok-dot); animation:pulse 2.4s ease-in-out infinite; flex:none; }

  .btn{ font-size:13.5px; font-weight:650; letter-spacing:-.006em; border:none; border-radius:999px; padding:10px 16px; cursor:pointer; }
  .btn-primary{ color:#fff; background:var(--accent); box-shadow:0 1px 2px rgba(11,18,32,.10); }
  .btn-primary:hover{ background:var(--accent-hover); }
  .btn-ghost{ background:transparent; color:var(--muted); }
  .btn-ghost:hover{ color:var(--text); }
  .btn-sm{ font-size:13px; padding:8px 14px; border-radius:999px; }
  .btn:disabled{ opacity:.5; cursor:default; }

  .compress-dlg{ border:1px solid var(--border); border-radius:22px; background:var(--surface); color:var(--text); padding:20px; width:min(360px, calc(100vw - 32px)); box-shadow:var(--shadow); }
  .compress-dlg::backdrop{ background:rgba(6,8,14,.55); }
  .compress-dlg h3{ margin:0 0 4px; font-size:16px; font-weight:650; }
  .compress-dlg .sub{ margin:0 0 16px; font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .compress-dlg label{ display:flex; justify-content:space-between; font-size:13.5px; font-weight:550; margin-top:12px; }
  .compress-dlg output{ color:var(--muted); font-variant-numeric:tabular-nums; }
  .compress-dlg input[type=range]{ width:100%; margin:8px 0 0; accent-color:var(--accent); }
  .compress-dlg .est{ margin:16px 0 0; font-size:14px; font-weight:600; min-height:19px; } /* min-height: the dialog mustn't resize under your finger while it recalculates */
  .compress-dlg .est.pending{ color:var(--muted); font-weight:500; }
  .compress-dlg .hint{ margin:6px 0 0; font-size:12.5px; color:var(--muted); }
  .compress-dlg .actions{ display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin-top:18px; }

  .stats-row{ display:flex; border-bottom:1px solid var(--border-2); flex-wrap:wrap; }
  .stat{ flex:1; min-width:150px; padding:18px 24px; border-right:1px solid var(--border-2); }
  .stat:last-child{ border-right:none; }
  .stat-label{ font-size:12.5px; color:var(--muted); }
  .stat-val{ display:flex; align-items:baseline; gap:5px; margin-top:6px; }
  .stat-num{ font-size:28px; font-weight:700; letter-spacing:-.038em; font-variant-numeric:tabular-nums; }
  .stat-unit{ font-size:14px; font-weight:600; color:var(--muted-2); }

  .content-row{ flex:1; display:flex; min-height:0; }
  .files-col{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .files-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 24px 12px; flex-wrap:wrap; container-type:inline-size; }
  /* Upload is the main thing you came for, so it grows when the toolbar has the room - measured
     on the toolbar, not the window: the side nav and right panel take most of the difference. */
  @container (min-width:640px){ #uploadBtn{ font-size:15px; padding:12px 24px; } }
  .files-title-wrap{ display:flex; align-items:baseline; gap:10px; }
  .files-title{ font-size:16px; font-weight:700; letter-spacing:-.025em; }
  .files-count{ font-size:13px; font-weight:500; color:var(--muted-2); font-variant-numeric:tabular-nums; }

  /* Wraps rather than pushing the page wider than a phone: at 435px+ it was one row, and on a
     360-393px phone the whole page scrolled sideways (the List/Grid toggle hung off the edge). */
  .files-controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; } /* a wrapped Upload stays at the right edge, by the drop box */
  .files-controls > *{ white-space:nowrap; }
  .sort-select{ font-family:inherit; font-size:13px; font-weight:600; color:var(--muted); background:var(--track); border:none; border-radius:999px; padding:8px 10px; cursor:pointer; }
  .view-toggle{ display:flex; background:var(--track); border-radius:999px; padding:3px; gap:2px; }
  .view-toggle button{ font-family:inherit; font-size:13px; font-weight:600; padding:7px 14px; border-radius:999px; cursor:pointer; border:none; background:none; color:var(--muted); }
  .view-toggle button.active{ background:var(--surface); color:var(--text); box-shadow:0 1px 1px rgba(11,18,32,.04), 0 2px 6px -1px rgba(11,18,32,.14); }

  .sel-bar{ display:flex; align-items:center; justify-content:space-between; margin:0 24px 10px; background:var(--accent-wash); border:1px solid var(--accent-wash-border); border-radius:16px; padding:10px 13px; }
  .sel-label{ font-size:13.5px; color:var(--accent-hover); font-weight:600; }
  .sel-actions{ display:flex; gap:8px; align-items:center; }
  .link-btn{ font-size:13px; color:var(--muted); background:none; border:none; cursor:pointer; padding:8px 10px; }
  .link-btn:hover{ color:var(--text); }

  .file-list{ padding:0 24px 24px; }
  .file-head-row{ display:flex; gap:16px; padding:0 10px 9px; font-size:12px; font-weight:600; color:var(--muted-2); border-bottom:1px solid var(--border-2); }
  .col-check{ width:16px; flex:none; }
  .col-name{ flex:1; }
  .col-size{ width:78px; flex:none; text-align:right; }
  .col-when{ width:92px; flex:none; text-align:right; }
  .col-src{ width:110px; flex:none; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .col-get{ width:108px; flex:none; }

  .file-row{ display:flex; align-items:center; gap:16px; padding:10px; border-bottom:1px solid var(--border-2); border-radius:12px; cursor:pointer; }
  .file-row:hover{ background:var(--surface-2); }
  .file-row.selected{ background:var(--accent-wash); }
  .checkbox{ width:16px; height:16px; border-radius:50%; border:1.5px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:700; flex:none; }
  .checkbox.checked{ border-color:var(--accent); background:var(--accent); }
  .file-thumb{ width:32px; height:32px; border-radius:10px; flex:none; background:repeating-linear-gradient(45deg,var(--track) 0 5px, var(--surface-2) 5px 10px); border:1px solid var(--border-2); display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; letter-spacing:.02em; color:var(--muted-2); overflow:hidden; }
  .file-thumb img, .file-thumb video, .tile-thumb img, .tile-thumb video{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb-clickable{ cursor:zoom-in; }
  .thumb-clickable:hover{ filter:brightness(.9); }
  /* Two lines rather than a single ellipsised one: a long Hebrew name lost both ends to bidi clipping. */
  .file-name{ font-size:14px; font-weight:500; letter-spacing:-.008em; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-word; }
  .name-wrap{ min-width:0; flex:1; }
  .file-meta{ display:none; font-size:11.5px; font-weight:500; color:var(--muted-2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* Search results come from the whole share, so each row says which folder it's in (and takes you there). */
  .in-folder{ font-size:11.5px; color:var(--muted-2); background:none; border:none; padding:2px 0 0; font-family:inherit; cursor:pointer; display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; }
  .in-folder:hover{ color:var(--accent); }
  .new-badge{ flex:none; font-size:11px; font-weight:600; color:var(--accent-hover); background:var(--accent-wash); padding:2px 8px; border-radius:999px; }
  .get-btn{ font-size:13px; font-weight:600; color:var(--accent); background:none; border:none; cursor:pointer; padding:4px; }
  .del-btn{ font-size:12.5px; color:var(--muted-2); background:none; border:none; cursor:pointer; padding:4px; }
  .del-btn:hover{ color:var(--danger); }
  .row-actions{ width:108px; flex:none; display:flex; justify-content:flex-end; align-items:center; gap:8px; }

  .file-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; padding:2px 24px 24px; }
  .tile{ border:1px solid var(--border-2); border-radius:18px; overflow:hidden; cursor:pointer; background:var(--surface); }
  .tile.selected{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash); }
  .tile-thumb{ height:104px; background:repeating-linear-gradient(45deg,var(--track) 0 6px, var(--surface-2) 6px 12px); display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; letter-spacing:.06em; color:var(--muted-2); overflow:hidden; }
  .tile-body{ padding:10px 11px 12px; }
  .tile-name{ font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile-meta{ font-size:11.5px; font-weight:500; color:var(--muted-2); margin-top:3px; font-variant-numeric:tabular-nums; }

  .empty-state{ color:var(--muted-2); font-size:14px; padding:40px 20px; text-align:center; }

  /* On the PC until the first phone connects: pairing is the first thing anyone does, and the QR was in Settings. */
  .pair-card{ display:flex; align-items:center; gap:18px; margin:0 24px 14px; }
  .pair-qr{ width:116px; height:116px; flex:none; border-radius:14px; border:1px solid var(--border); background:#fff; padding:6px; }
  .pair-title{ font-size:15px; font-weight:700; letter-spacing:-.02em; }
  .pair-text{ font-size:13px; color:var(--muted); line-height:1.55; margin-top:4px; max-width:440px; }

  /* Folders */
  .crumbs{ display:flex; align-items:center; gap:2px; flex-wrap:wrap; min-width:0; }
  .crumb{ font-family:inherit; font-size:16px; font-weight:700; letter-spacing:-.025em; color:var(--accent); background:none; border:none; cursor:pointer; padding:2px 5px; border-radius:999px; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crumb:hover{ background:var(--track); }
  .crumb.current{ color:var(--text); cursor:default; }
  .crumb.current:hover{ background:none; }
  .crumb-sep{ color:var(--muted-2); font-size:14px; }
  .thumb-folder{ background:var(--accent-wash); border-color:var(--accent-wash-border); color:var(--accent); }
  .drop-into{ background:var(--accent-wash) !important; box-shadow:inset 0 0 0 2px var(--accent); }
  .crumb.drop-into{ box-shadow:0 0 0 2px var(--accent); }
  .file-row[draggable="true"], .tile[draggable="true"]{ -webkit-user-drag:element; }
  .file-thumb.thumb-folder svg{ width:17px; height:17px; }
  .tile-thumb.thumb-folder svg{ width:40px; height:40px; }

  /* Right-click / long-press menu */
  .ctx-menu{ position:fixed; z-index:120; min-width:190px; max-width:min(300px, 90vw); max-height:60vh; overflow:auto; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:6px; }
  .ctx-item{ display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; text-align:left; font-family:inherit; font-size:13.5px; color:var(--text); background:none; border:none; border-radius:10px; padding:9px 10px; cursor:pointer; }
  .ctx-item:hover{ background:var(--surface-2); }
  .ctx-item span:first-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ctx-item.danger{ color:var(--danger); }
  .ctx-sep{ height:1px; background:var(--border-2); margin:5px 4px; }
  .ctx-head{ font-size:11.5px; font-weight:600; color:var(--muted-2); padding:7px 10px 4px; }

  /* Right panel */
  .right-panel{ width:284px; flex:none; border-left:1px solid var(--border-2); padding:18px 20px 24px; display:flex; flex-direction:column; gap:20px; overflow-y:auto; }
  .dropzone{ border:1.5px dashed var(--border); border-radius:20px; background:var(--surface-2); padding:26px 12px; text-align:center; cursor:pointer; transition:.15s border-color, .15s background; }
  .dropzone.drag{ border-color:var(--accent); background:var(--accent-wash); }
  .dropzone-title{ font-size:14px; font-weight:600; }
  .dropzone-sub{ font-size:12.5px; color:var(--muted-2); margin-top:5px; }
  input[type=file]{ display:none; }

  .panel-title{ font-size:13px; font-weight:600; }
  .panel-title-row{ display:flex; align-items:baseline; justify-content:space-between; }

  .transfer-card{ border:1px solid var(--border); border-radius:16px; padding:12px; }
  .transfer-top{ display:flex; justify-content:space-between; gap:8px; }
  .transfer-name{ font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .transfer-name.queued{ color:var(--muted); font-weight:400; }
  .transfer-pct{ font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; color:var(--accent); flex:none; }
  .transfer-pct.queued{ color:var(--muted-2); font-weight:500; }
  .transfer-sub{ font-size:11.5px; font-weight:500; font-variant-numeric:tabular-nums; color:var(--muted-2); margin-top:8px; }
  .transfer-sub-row{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .mini-btn{ font-size:11.5px; font-weight:600; color:var(--accent); background:none; border:none; cursor:pointer; padding:0; }
  .mini-btn.danger{ color:var(--danger); }

  .text-box{ border:1px solid var(--border); border-radius:16px; padding:12px; background:var(--surface); }
  .text-box textarea{ width:100%; border:none; outline:none; resize:none; background:transparent; font-family:inherit; font-size:13px; color:var(--text); line-height:1.55; min-height:44px; }
  .text-box textarea::placeholder{ color:var(--muted-2); }

  .toast{ background:var(--text); color:var(--bg); font-size:13px; font-weight:500; padding:10px 14px; border-radius:16px; box-shadow:var(--shadow); animation:toast-in .15s ease-out; max-width:320px; display:flex; align-items:center; gap:12px; overflow-wrap:anywhere; } /* anywhere: a sent link has no spaces to wrap at */
  /* inherit + underline, not accent: the toast is inverted, so a brand colour lands on the wrong background half the time */
  .toast-action{ font:inherit; font-weight:700; color:inherit; background:none; border:none; padding:0; cursor:pointer; text-decoration:underline; white-space:nowrap; }

  .preview-actions{ margin-top:12px; display:flex; flex-wrap:wrap; justify-content:center; gap:10px; flex:none; } /* four buttons for a HEIC don't fit a 375px phone */
  .preview-actions .btn{ background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.22); }

  .preview-close{ position:fixed; top:16px; right:20px; width:38px; height:38px; border-radius:50%; border:none; background:rgba(255,255,255,.12); color:#fff; font-size:20px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .preview-close:hover{ background:rgba(255,255,255,.22); }
  .preview-nav{ position:fixed; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%; border:none; background:rgba(255,255,255,.12); color:#fff; font-size:24px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; }

  @media (max-width:640px){ .preview-nav{ width:38px; height:38px; font-size:20px; } .preview-prev{ left:8px; } .preview-next{ right:8px; } }

  /* Mobile bottom nav */
  #mobile-nav{ display:none; }

  /* Generic view panels used for Devices / Clipboard / Settings full-page views */

  .page-title{ font-size:19px; font-weight:700; letter-spacing:-.025em; margin:4px 0 4px; }

  .settings-input{ font-family:inherit; font-size:14px; border:1px solid var(--border); border-radius:12px; padding:10px 12px; background:var(--surface); color:var(--text); width:100%; max-width:320px; }
  .url-row{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:8px; word-break:break-all; }
  .seg{ display:inline-flex; background:var(--track); border-radius:999px; padding:3px; gap:2px; }
  .seg button{ font-family:inherit; font-size:13px; font-weight:600; padding:7px 15px; border-radius:999px; cursor:pointer; border:none; background:none; color:var(--muted); }
  .seg button.active{ background:var(--surface); color:var(--text); box-shadow:0 1px 1px rgba(11,18,32,.04), 0 2px 6px -1px rgba(11,18,32,.14); }
  /* Scrolls inside the card, so the count and Empty now stay put below it. */

  .trash-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border-2); font-size:13.5px; }
  .trash-row:last-child{ border-bottom:none; }

  /* The side plate and right panel eat the width long before the window reaches phone size:

  #listView{ container-type:inline-size; }

  }
  /* Touch: delete is swipe-left or press-and-hold, not a × a thumb-width from Get. */

      </div>

<script>
(function(){
  'use strict';
  if (window.isSecureContext) document.documentElement.classList.add('secure');

  // ---------- device identity ----------
  function genId(){
    return 'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }
  function guessKind(){
    const ua = navigator.userAgent;
    if (/iPad/.test(ua)) return 'iPad';
    if (/iPhone/.test(ua)) return 'iPhone';
    if (/Android/.test(ua)) return 'Android';
    if (/Macintosh/.test(ua)) return 'Mac';
    if (/Windows/.test(ua)) return 'Windows PC';
    return 'Device';
  }
  // Safari clears localStorage after a week without a visit; the server also keeps the id in a
  // cookie (set on ping), so the phone stays the same device instead of turning up twice.
  let deviceId = localStorage.getItem('ls_device_id') || (document.cookie.match(/(?:^|; )ls_dev=([\w-]+)/) || [])[1];
  if (!deviceId) deviceId = genId();
  localStorage.setItem('ls_device_id', deviceId);
  let deviceName = localStorage.getItem('ls_device_name') || guessKind();

  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({ 'X-Device-Id': deviceId }, opts.headers || {});
    return fetch(path, opts);
  }
  function apiJson(path, method, body){
    return api(path, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: body !== undefined ? JSON.stringify(body) : undefined,
    }).then(r => r.text().then(t => {
      let j = {};
      try { j = JSON.parse(t); } catch (e) {} // a 413/500 comes back as HTML, not JSON
      return { ok: r.ok, status: r.status, body: j };
    }));
  }

  // ---------- toast ----------
  const toasts = document.getElementById('toasts');
  // action: { label, run } - the toast is where "Undo" lives, so a delete needs no confirm dialog.
  function toast(msg, ms, action){
    const el = document.createElement('div');
    el.className = 'toast';
    el.appendChild(document.createTextNode(msg));
    if (action){
      const b = document.createElement('button');
      b.className = 'toast-action';
      b.textContent = action.label;
      b.addEventListener('click', () => { el.remove(); action.run(); });
      el.appendChild(b);
    }
    toasts.appendChild(el);
    if (ms !== 0){
      // One that lands while the tab is in the background waits until you're back to read it.
      const start = () => setTimeout(() => el.remove(), ms || 3500);
      if (document.hidden) document.addEventListener('visibilitychange', start, { once: true });
      else start();
    }
    return el;
  }
  // A phone that lost the PC used to just sit on a stale list with no hint why.
  let offlineToast = null;
  function setOffline(v){
    if (v === !!offlineToast) return;
    if (v){ offlineToast = toast("Can't reach the PC. Retrying…", 0); return; }
    offlineToast.remove(); offlineToast = null;
    toast('Reconnected');
  }

  // navigator.clipboard only exists in a secure context. Over plain http on the LAN -
  // i.e. every phone that connects here - it's undefined, so tap-to-copy silently did
  // nothing. Fall back to the execCommand/selection trick, incl. the iOS variant.
  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => toast('Copied'), legacyCopy);
      return;
    }
    legacyCopy();

    function legacyCopy(){
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.contentEditable = 'true';
      ta.style.cssText = 'position:fixed; top:0; left:0; width:1px; height:1px; opacity:0;';
      document.body.appendChild(ta);
      const range = document.createRange();
      range.selectNodeContents(ta);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      ta.setSelectionRange(0, text.length); // iOS ignores the range from select() alone
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      sel.removeAllRanges();
      ta.remove();
      toast(ok ? 'Copied' : 'Copy blocked. Tap and hold the text instead');
    }
  }

  // Copy an actual image to the clipboard.
  //   * Real image bytes need navigator.clipboard.write, which only exists in a secure
  //     context - that's the PC opening this at localhost, or any https setup.
  //   * Over plain http on the LAN (i.e. from a phone) that API is simply absent, and no
  //     amount of JS can put raw bytes on the clipboard. There we fall back to copying the
  //     image as an HTML reference, which pastes fine into a doc or email on the same
  //     network, and say so rather than claiming a full copy.
  function copyImage(name, imgEl){
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      // ClipboardItem must be constructed synchronously with a promise value, or Safari
      // decides the user gesture has expired.
      const png = fetch(fileUrl(name)).then(r => r.blob()).then(toPngBlob);
      toast('Copying image…'); // re-encoding a big photo to PNG takes a second or two

  // ---------- formatting ----------
  function fmtSize(bytes){
    if (bytes == null) return '-';
    if (bytes < 1024) return bytes + ' B';

    do { bytes /= 1024; i++; } while (bytes >= 1024 && i < units.length - 1);

  function fmtWhen(ms){

    if (diff < hr) return Math.round(diff/min) + 'm ago';
    if (diff < day) return Math.round(diff/hr) + 'h ago';

  const IMAGE_EXTS = ['jpg','jpeg','png','heic','heif','gif','webp','bmp','svg'];

  function isAudioFile(name){ return AUDIO_EXTS.includes(extOf(name)); }

    renderSelBar(list);

    const isList = state.listView === 'list';
    document.getElementById('listView').style.display = isList ? 'block' : 'none';
    document.getElementById('gridView').style.display = isList ? 'none' : 'grid';
    document.getElementById('listTabBtn').classList.toggle('active', isList);
    document.getElementById('gridTabBtn').classList.toggle('active', !isList);

    const rows = document.getElementById('listRows');
    const grid = document.getElementById('gridView');
    // Only the view on screen gets built: the hidden one doubled the work, and its videos
    // fetched their first frames all the same. Switching views calls this again.
    const shown = isList ? rows : grid;
    (isList ? grid : rows).innerHTML = '';
    if (lazyVideos) lazyVideos.disconnect(); // everything it watches is about to be replaced

    if (!list.length){
      shown.innerHTML = '<div class="empty-state">' + (state.q || state.type !== 'all' ? 'No files match your search.'
        : matchMedia('(pointer:coarse)').matches ? 'Nothing here yet. Tap Upload to add files.' : 'Nothing here yet. Drop files here, or click Upload.') + '</div>';
      return;
    }

    const recentMs = 5 * 60 * 1000;
    const clickable = (f) => f.isDir || isPreviewable(f.name) || isOpenable(f.name);
    const sub = (f) => f.isDir ? (f.count === 1 ? '1 file' : f.count + ' files') : fmtSize(f.size);
    // Search hits come from anywhere in the share, so each one says where it lives.
    const folderOf = (f) => f.path.split('/').slice(0, -1).join('/');
    const whereLine = (f) => (state.q.trim() && folderOf(f))
      ? `<button class="in-folder" data-role="in-folder">in ${escapeHtml(folderOf(f))}</button>` : '';
    if (isList) rows.innerHTML = list.map(f => {
      const sel = !!state.sel[f.path];
      const recent = (Date.now() - f.mtime) < recentMs;
      return `
        <div class="file-row ${sel ? 'selected' : ''}" data-path="${escapeHtml(f.path)}">
          <div class="col-check"><div class="checkbox ${sel ? 'checked' : ''}" data-role="check">${sel ? '✓' : ''}</div></div>
          <div class="col-name" style="display:flex; align-items:center; gap:12px; min-width:0;">
            <div class="file-thumb ${f.isDir ? 'thumb-folder' : ''} ${clickable(f) ? 'thumb-clickable' : ''}" data-role="thumb">${thumbHtml(f)}</div>
            <div class="name-wrap">
              <div class="file-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div>
              <div class="file-meta">${sub(f)} &middot; ${fmtWhen(f.mtime)} &middot; ${escapeHtml(f.addedBy)}</div>
              ${whereLine(f)}
            </div>
            ${recent ? '<div class="new-badge" title="Added in the last 5 minutes">New</div>' : ''}
          </div>
          <div class="col-size mono" style="color:var(--muted);">${sub(f)}</div>
          <div class="col-when" style="color:var(--muted-2); font-size:13px;">${fmtWhen(f.mtime)}</div>
          <div class="col-src" style="color:var(--muted-2); font-size:13px;">${escapeHtml(f.addedBy)}</div>
          <div class="row-actions">
            ${!f.isDir && isImageFile(f.name) ? '<button class="del-btn" data-role="copy-img" title="Copy image to clipboard">Copy</button>' : ''}
            <button class="get-btn" data-role="get">Get</button>
            <button class="del-btn" data-role="del" title="Delete">&times;</button>
          </div>
        </div>`;
    }).join('');

    else grid.innerHTML = list.map(f => {
      const sel = !!state.sel[f.path];
      return `
        <div class="tile ${sel ? 'selected' : ''}" data-path="${escapeHtml(f.path)}">
          <div class="tile-thumb ${f.isDir ? 'thumb-folder' : ''} ${clickable(f) ? 'thumb-clickable' : ''}" data-role="thumb">${thumbHtml(f)}</div>
          <div class="tile-body">
            <div class="tile-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</div>
            <div class="tile-meta">${sub(f)} &middot; ${fmtWhen(f.mtime)}</div>
            ${whereLine(f)}
          </div>
        </div>`;
    }).join('');

    // One handler per card: a folder opens, a file behaves as before (thumb previews, body selects).
    const wireCard = (card) => {
      const f = entryAt(card.dataset.path);
      if (!f) return;
      card.addEventListener('click', (e) => {
        if (e.target.closest('[data-role="get"], [data-role="del"], [data-role="copy-img"]')) return;
        if (e.target.closest('[data-role="in-folder"]')) return goToFolder(folderOf(f));
        if (e.target.closest('[data-role="check"]')) return toggleSel(f.path, e.shiftKey);
        if (f.isDir) return goToFolder(f.path); // select a folder from its checkbox or the right-click menu
        if (e.target.closest('[data-role="thumb"]')) return openFile(f.path);
        // Phone: a tap opens (previews, or saves what can't be previewed); only the checkbox selects.
        if (matchMedia('(max-width:900px)').matches) return (isPreviewable(f.name) || isOpenable(f.name)) ? openFile(f.path) : getEntry(f);
        toggleSel(f.path, e.shiftKey);
      });
      // Double-click opens, the way every file manager does it (the two selection toggles cancel out).
      card.addEventListener('dblclick', (e) => {
        if (e.target.closest('button, [data-role="check"]')) return;
        f.isDir ? goToFolder(f.path) : openFile(f.path);
      });
      const get = card.querySelector('[data-role="get"]');
      if (get) get.addEventListener('click', (e) => { e.stopPropagation(); getEntry(f); });
      const del = card.querySelector('[data-role="del"]');
      if (del) del.addEventListener('click', (e) => { e.stopPropagation(); deleteEntry(f); });
      const copyImgBtn = card.querySelector('[data-role="copy-img"]');
      // The thumbnail is the real file (just scaled by CSS), so it's already the image to copy.
      if (copyImgBtn) copyImgBtn.addEventListener('click', (e) => { e.stopPropagation(); copyImage(f.path, card.querySelector('[data-role="thumb-media"]')); });
      wireDragSource(card, f);
      if (f.isDir) wireDropTarget(card, f.path);
    };
    shown.querySelectorAll('.file-row, .tile').forEach(wireCard);
    wireThumbFallbacks(shown);
  }

  // ---------- image / video preview lightbox ----------
  const previewOverlay = document.getElementById('previewOverlay');
  const previewBody = document.getElementById('previewBody');
  const previewCaption = document.getElementById('previewCaption');
  let previewList = [];
  let previewIndex = -1;

  // Thumbnail click: lightbox for media, a new tab for things the browser can show (PDF), else select.
  function openFile(p){
    const name = p.split('/').pop();
    if (isPreviewable(name)) openPreview(p);
    else if (isOpenable(name)) window.open(fileUrl(p), '_blank');
    else toggleSel(p);
  }
  function openPreview(p){
    const list = filteredFiles().filter(f => !f.isDir && isPreviewable(f.name));
    const idx = list.findIndex(f => f.path === p);
    if (idx === -1) return;
    previewList = list;
    previewIndex = idx;
    renderPreview();
    previewOverlay.style.display = 'flex';
  }
  function closePreview(){
    previewOverlay.style.display = 'none';
    previewBody.innerHTML = '';
  }
  function stepPreview(delta){
    if (previewList.length < 2) return;
    previewIndex = (previewIndex + delta + previewList.length) % previewList.length;
    renderPreview();
  }
  function renderPreview(){
    const f = previewList[previewIndex];
    if (!f) return closePreview();
    const url = fileUrl(f.path);
    previewBody.innerHTML = isVideoFile(f.name) ? `<video src="${url}" controls autoplay playsinline></video>`
      : isAudioFile(f.name) ? `<audio src="${url}" controls autoplay></audio>`
      : `<img src="${url}" alt="${escapeHtml(f.name)}">`;
    previewCaption.textContent = f.name + '  ·  ' + fmtSize(f.size);
    // Can't decode the original (HEVC on Windows, MKV on a phone…)? Play a converted copy
    // instead; only if that fails too, say so and point at Save rather than show a black box.
    const note = (html) => `<div style="color:#c7ccd8;text-align:center;max-width:320px;line-height:1.5;">${html}</div>`;
    const v = previewBody.querySelector('video');
    if (v) v.addEventListener('error', () => {
      if (previewList[previewIndex] !== f) return; // already stepped to another file
      previewBody.innerHTML = note('Preparing a version this browser can play&hellip;') + `<video src="${previewUrl(f.path, 'video')}" controls autoplay playsinline style="display:none"></video>`;
      const alt = previewBody.querySelector('video');
      alt.addEventListener('loadeddata', () => { alt.style.display = ''; alt.previousElementSibling.remove(); }, { once: true });
      alt.addEventListener('error', () => {
        previewBody.innerHTML = note(`This browser can't play .${escapeHtml(extOf(f.name))} videos.<br>Tap <b>Save</b> to download it and open it in a player app (e.g. VLC).`);
      }, { once: true });
    }, { once: true });
    const im = previewBody.querySelector('img');
    if (im) im.addEventListener('error', () => { im.src = previewUrl(f.path, 'image'); }, { once: true });
    document.getElementById('previewCopy').style.display = isImageFile(f.name) ? '' : 'none';
    document.getElementById('previewJpeg').style.display = isHeic(f.name) ? '' : 'none';
    const multi = previewList.length > 1;
    document.getElementById('previewPrev').style.display = multi ? 'flex' : 'none';
    document.getElementById('previewNext').style.display = multi ? 'flex' : 'none';
  }
  document.getElementById('previewCopy').addEventListener('click', () => {
    const f = previewList[previewIndex];
    if (f) copyImage(f.path, previewBody.querySelector('img'));
  });
  document.getElementById('previewGet').addEventListener('click', () => {
    const f = previewList[previewIndex];
    if (f) downloadFile(f.path);
  });
  document.getElementById('previewJpeg').addEventListener('click', () => {
    const f = previewList[previewIndex];
    if (f) downloadJpeg(f.path);
  });
  document.getElementById('previewLink').addEventListener('click', () => {
    const f = previewList[previewIndex];
    if (f) copyText(location.origin + fileUrl(f.path));
  });
  document.getElementById('previewClose').addEventListener('click', closePreview);
  document.getElementById('previewPrev').addEventListener('click', () => stepPreview(-1));
  document.getElementById('previewNext').addEventListener('click', () => stepPreview(1));
  previewOverlay.addEventListener('click', (e) => { if (e.target === previewOverlay) closePreview(); });
  document.addEventListener('keydown', (e) => {
    if (previewOverlay.style.display === 'none') return;
    if (e.key === 'Escape') closePreview();
    else if (e.key === 'ArrowLeft') stepPreview(-1);
    else if (e.key === 'ArrowRight') stepPreview(1);
  });

  // Touch: swipe sideways for the next one, down to close, as in Photos. Pinch stays the
  // browser's own zoom, so a second finger or a zoomed-in page pans instead of swiping, and
  // a drag on a video or audio player is scrubbing, not a swipe.
  let pvSwipe = null, pvNoClickUntil = 0;
  previewOverlay.addEventListener('touchstart', (e) => {
    const zoomed = window.visualViewport && visualViewport.scale > 1.01;
    pvSwipe = e.touches.length === 1 && !zoomed && !e.target.closest('video, audio, button')
      ? { x0: e.touches[0].clientX, y0: e.touches[0].clientY, axis: null, d: 0 } : null;
  }, { passive: true });
  previewOverlay.addEventListener('touchmove', (e) => {
    if (!pvSwipe) return;
    if (e.touches.length > 1){ pvSwipe = null; settlePreview(true); return; }
    e.preventDefault(); // or the page behind scrolls, and Android reads a pull-down as refresh
    const dx = e.touches[0].clientX - pvSwipe.x0, dy = e.touches[0].clientY - pvSwipe.y0;
    if (!pvSwipe.axis){ if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return; pvSwipe.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; }
    pvSwipe.d = pvSwipe.axis === 'x' ? dx : Math.max(0, dy);
    previewBody.style.transition = 'none';
    previewBody.style.transform = pvSwipe.axis === 'x' ? `translateX(${dx}px)` : `translateY(${pvSwipe.d}px)`;
    if (pvSwipe.axis === 'y') previewBody.style.opacity = Math.max(.3, 1 - pvSwipe.d / 400);
  }, { passive: false });
  const endPreviewSwipe = () => {
    const s = pvSwipe; pvSwipe = null;
    if (!s || !s.axis) return;
    pvNoClickUntil = Date.now() + 500; // the lifting finger can still click whatever it's over
    const step = s.axis === 'x' && Math.abs(s.d) > 60 && previewList.length > 1;
    settlePreview(!step);
    if (step) stepPreview(s.d < 0 ? 1 : -1);
    else if (s.axis === 'y' && s.d > 90) closePreview();
  };
  // Snap back into place; not animated when the next file is about to take its spot.
  function settlePreview(animate){
    previewBody.style.transition = animate ? 'transform .18s, opacity .18s' : 'none';
    previewBody.style.transform = previewBody.style.opacity = '';
  }
  previewOverlay.addEventListener('touchend', endPreviewSwipe);
  previewOverlay.addEventListener('touchcancel', endPreviewSwipe);
  previewOverlay.addEventListener('click', (e) => { if (Date.now() < pvNoClickUntil){ e.stopImmediatePropagation(); e.preventDefault(); } }, true); // Immediate: the backdrop's own close handler is on this same element

  const IS_PHONE = /iPhone|iPad|Android/.test(navigator.userAgent);
  function downloadFile(p){ downloadFiles([p]); }
  function downloadFiles(paths){
    if (!paths.length) return;
    // Phone on https: the Share sheet - "Save Video" to Photos or "Save to Files" - and the
    // app never leaves the screen. (Plain http has no navigator.share, so it takes the link.)
    if (IS_PHONE && navigator.canShare) return shareFiles(paths);
    paths.forEach((p, i) => setTimeout(() => linkDownload(p), i * 400)); // back-to-back clicks get dropped as spam
  }
  // Selected files download as themselves; only folders (no single file to give) get zipped.
  function downloadEntries(names){
    const dirs = names.filter(n => (state.files.find(f => f.path === n) || {}).isDir);
    downloadFiles(names.filter(n => !dirs.includes(n)));
    if (dirs.length) zipViaFetch(dirs);
  }
  function linkDownload(p, href, name){
    // A home-screen app has no back button, and iOS shows every download (link, attachment,
    // _blank, blob - all tried) as a full-screen file page with no way out. A link to a
    // different address, though, opens in a pop-up browser with a Done button. The PC answers
    // on both its name and its IP, so use whichever this app isn't on; ?k= lets that address in.
    const other = navigator.standalone && downloadOrigin();
    clickDownload((other || '') + (href || fileUrl(p) + '?download') + (other ? '&k=' + encodeURIComponent(serverInfo.passcode) : ''), name || p.split('/').pop());
  }
  // Windows can't open an iPhone's HEIC without a paid extension, so the PC makes a full-size
  // JPEG copy (date, camera and location kept) and sends that. The original stays as it is.
  function downloadJpeg(p){
    toast('Converting to JPEG…');
    linkDownload(p, previewUrl(p, 'jpeg'), p.split('/').pop().replace(/\.hei[cf]$/i, '.jpg'));
  }
  let serverInfo = null;
  if (navigator.standalone) api('/api/server-info').then(r => r.json()).then(i => { serverInfo = i; }).catch(() => {});
  function downloadOrigin(){
    if (!serverInfo) return null;
    const origins = [serverInfo.hostUrl, ...(serverInfo.lanUrls || [])].map(u => new URL(u).origin);
    return origins.find(o => o !== location.origin) || null;
  }
  function clickDownload(href, name){
    const a = document.createElement('a');
    a.href = href;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  function shareFiles(paths){
    const label = paths.length === 1 ? paths[0].split('/').pop() : paths.length + ' files';
    const t = toast('Preparing ' + label + '…', 0);
    const ctl = new AbortController();
    let total = 0;
    Promise.all(paths.map(p => fetch(fileUrl(p), { signal: ctl.signal }).then(r => {
      total += Number(r.headers.get('content-length')) || 0;
      // Files held in memory for the share sheet; past ~500MB an iPhone tab may crash, so take the links there
      if (!r.ok || total > 500 * 1024 * 1024){ ctl.abort(); throw new Error('link'); }
      return r.blob().then(b => new File([b], p.split('/').pop(), { type: b.type }));
    }))).then(files => {
      t.remove();
      if (!navigator.canShare({ files })) throw new Error('link');
      const share = () => navigator.share({ files }).catch(e => {
        // A slow fetch uses up the tap's permission to open the sheet - ask for one more tap.
        if (e.name === 'NotAllowedError') toast('Ready: ' + label, 0, { label: 'Save', run: share });
      });
      share();
    }).catch(() => { t.remove(); paths.forEach((p, i) => setTimeout(() => linkDownload(p), i * 400)); });
  }
  // A folder has no single file to download, so "Get" zips it.
  function getEntry(f){ f.isDir ? zipViaFetch([f.path]) : downloadFile(f.path); }

  function renameEntry(f){
    const newName = (prompt(f.isDir ? 'Rename folder' : 'Rename file', f.name) || '').trim(); // prompt(): works on every phone, zero UI to maintain
    if (!newName || newName === f.name) return;
    apiJson('/api/files/rename', 'POST', { name: f.path, to: newName }).then(res => {
      if (!res.ok){ toast(res.body.error || 'Rename failed'); return; }
      delete state.sel[f.path];
      state.sel[res.body.path] = true;
      refreshFiles();
    });
  }
  // Re-encoded on the PC with ffmpeg. "Replace" parks the original in the trash, so it gets
  // the same Undo a delete does.
  const COMPRESS_EXTS = ['jpg','jpeg','png','heic','heif','webp','bmp','mov','mp4','m4v','mkv','avi','webm'];
  const compressDlg = document.getElementById('compressDlg');
  for (const id of ['compressQuality', 'compressScale']){
    const input = document.getElementById(id);
    input.addEventListener('input', () => { document.getElementById(id + 'Out').textContent = input.value + '%'; estimateSoon(); });
  }
  // The estimate is a real encode on the PC, so it waits for the slider to settle, and only
  // the newest answer is allowed to land (they can come back out of order).
  let estTimer = null, estSeq = 0, estFile = null;
  function estimateSoon(){
    clearTimeout(estTimer);
    const el = document.getElementById('compressEst');
    el.className = 'est pending';
    el.textContent = 'Estimating…';
    estTimer = setTimeout(() => {
      const seq = ++estSeq, f = estFile;
      apiJson('/api/compress/estimate', 'POST', {
        name: f.path,
        quality: +document.getElementById('compressQuality').value,
        scale: +document.getElementById('compressScale').value,
      }).then(res => {
        if (seq !== estSeq || f !== estFile) return; // a later slider move already won
        if (!res.ok){ el.className = 'est pending'; el.textContent = 'No estimate available'; return; }
        const b = res.body;
        const pct = b.before ? Math.round((1 - b.bytes / b.before) * 100) : 0;
        el.className = 'est';
        el.textContent = (b.sampled ? '≈ ' : '') + fmtSize(b.bytes)
          + (pct > 0 ? ` · ${pct}% smaller` : ' · no smaller than the original');
      }).catch(() => { if (seq === estSeq){ el.className = 'est pending'; el.textContent = 'No estimate available'; } });
    }, 400);
  }
  function setSlider(id, v){
    const input = document.getElementById(id);
    input.value = v;
    document.getElementById(id + 'Out').textContent = v + '%';
  }
  function compressEntry(f){
    estFile = f;
    setSlider('compressQuality', 75); // back to the defaults every time: carrying the last file's 40% into this one silently shrinks it
    setSlider('compressScale', 100);
    const video = isVideoFile(f.name);
    const ext = extOf(f.name);
    document.getElementById('compressName').textContent = `${f.name} · ${fmtSize(f.size)}`;
    document.getElementById('compressHint').textContent = video ? 'Saved as MP4. Long videos can take a few minutes.'
      : ext === 'webp' ? 'Saved as WebP.' : ext === 'jpg' || ext === 'jpeg' ? 'Saved as JPEG.' : 'Saved as JPEG (transparency is lost).';
    estimateSoon();
    // submit, not the dialog's close event: close is dispatched on a later rendering task, which a backgrounded tab may never run
    compressDlg.querySelector('form').onsubmit = (e) => {
      clearTimeout(estTimer);
      estFile = null; // whatever is still in flight has nowhere to land now
      const choice = e.submitter && e.submitter.value;
      if (choice !== 'copy' && choice !== 'overwrite') return;
      const working = toast(`Compressing ${f.name}…`, 0);
      apiJson('/api/compress', 'POST', {
        name: f.path,
        quality: +document.getElementById('compressQuality').value,
        scale: +document.getElementById('compressScale').value,
        overwrite: choice === 'overwrite',
      }).then(res => {
        working.remove();
        if (!res.ok) return toast(res.body.error || 'Compress failed');
        const b = res.body;
        if (b.skipped) return toast(`Not smaller at these settings (${fmtSize(b.after)}), so nothing changed`, 5000);
        refreshFiles();
        const msg = `${fmtSize(b.before)} → ${fmtSize(b.after)}`;
        toast(msg, 8000, b.trash ? { label: 'Undo', run: () => {
          // drop the compressed one first, so the original gets its own name back
          apiJson('/api/files?name=' + encodeURIComponent(b.path), 'DELETE')
            .then(r => r.ok ? apiJson('/api/restore', 'POST', { entry: b.trash }) : r)
            .then(r => { toast(r.ok ? 'Original restored' : 'Could not restore'); refreshFiles(); });
        } } : null);
      }).catch(() => { working.remove(); toast('Compress failed'); });
    };
    compressDlg.showModal();
  }

  // Deleting is undoable (the server parks it in a trash folder for a week), so a single
  // file goes straight away and Undo does the reassuring - only a whole folder still asks.
  function undoToast(entries, n){
    if (!entries.length) return;
    toast(`Deleted ${n} item${n === 1 ? '' : 's'}`, 8000, { label: 'Undo', run: () => {
      Promise.all(entries.map(e => apiJson('/api/restore', 'POST', { entry: e })))
        .then(res => { toast(res.every(r => r.ok) ? 'Restored' : 'Could not restore everything'); refreshFiles(); });
    } });
  }
  function deleteEntry(f){
    if (f.isDir && !confirm(`Delete folder "${f.name}" and the ${f.count} file${f.count === 1 ? '' : 's'} in it?`)) return;
    apiJson('/api/files?name=' + encodeURIComponent(f.path), 'DELETE').then(res => {
      delete state.sel[f.path];
      refreshFiles();
      if (!res.ok) return toast(res.body.error || 'Delete failed'); // don't let it look deleted when it isn't
      undoToast([res.body.trash], 1);
    });
  }

  document.getElementById('listTabBtn').addEventListener('click', () => { state.listView = 'list'; localStorage.setItem('ls_list_view','list'); renderFiles(); });
  document.getElementById('gridTabBtn').addEventListener('click', () => { state.listView = 'grid'; localStorage.setItem('ls_list_view','grid'); renderFiles(); });
  document.getElementById('clearSelBtn').addEventListener('click', () => { state.sel = {}; renderSel(); });
  document.getElementById('selAllBox').addEventListener('click', () => {
    const list = filteredFiles();
    const allChecked = list.length > 0 && list.every(f => state.sel[f.path]);
    if (allChecked) for (const f of list) delete state.sel[f.path];
    else for (const f of list) state.sel[f.path] = true;
    renderSel();
  });
  document.getElementById('delSelBtn').addEventListener('click', deleteSelected);
  document.getElementById('renameSelBtn').addEventListener('click', () => { const n = selectedNames(); if (n.length === 1 && entryAt(n[0])) renameEntry(entryAt(n[0])); });
  document.getElementById('moveSelBtn').addEventListener('click', (e) => { const r = e.currentTarget.getBoundingClientRect(); showMoveMenu(selectedNames(), r.left, r.bottom + 4); });
  const sortSelect = document.getElementById('sortSelect');
  sortSelect.value = state.sort;
  sortSelect.addEventListener('change', () => { state.sort = sortSelect.value; localStorage.setItem('ls_sort', state.sort); renderFiles(); });
  const typeSelect = document.getElementById('typeSelect');
  typeSelect.value = state.type;
  typeSelect.addEventListener('change', () => { state.type = typeSelect.value; localStorage.setItem('ls_type', state.type); state.sel = {}; renderFiles(); });

  // Keyboard: "/" search, Esc clears search/selection, Ctrl/Cmd+A selects what's shown, Delete deletes the selection.
  document.addEventListener('keydown', (e) => {
    if (previewOverlay.style.display !== 'none' || state.view !== 'files') return;
    const el = document.activeElement;
    const typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
    const search = document.getElementById('searchInput');
    if (e.key === 'Escape'){
      if (el === search){ search.value = ''; search.blur(); setQuery(''); }
      else if (!typing && selectedNames().length){ state.sel = {}; renderSel(); }
      return;
    }
    if (typing) return;

    Promise.all(names.map(n => apiJson('/api/files?name=' + encodeURIComponent(n), 'DELETE')))
      .then(res => {
        state.sel = {};

  // Search covers the whole share, not just the folder you're standing in, so it goes to
  // the server. What's already loaded is re-filtered on the spot, so typing still feels instant.
  let searchTimer = null;

  function zipViaFetch(names){

      if (it.head){ ctxMenu.insertAdjacentHTML('beforeend', `<div class="ctx-head">${escapeHtml(it.head)}</div>`); continue; }
      const b = document.createElement('button');
      b.className = 'ctx-item' + (it.danger ? ' danger' : '');
      b.innerHTML = `<span>${escapeHtml(it.label)}</span>`;
      b.addEventListener('click', () => { if (!it.keepOpen) closeCtx(); it.run(); });

    ctxMenu.style.left = ctxMenu.style.top = '0px'; // measure at its natural size first

  function entryMenu(f, x, y){

    const items = [];
    if (f.isDir) items.push({ label: 'Open folder', run: () => goToFolder(f.path) });
    else if (isPreviewable(f.name) || isOpenable(f.name)) items.push({ label: 'Open', run: () => openFile(f.path) });
    items.push({
      label: multi ? `Download ${names.length} items` : (f.isDir ? 'Download as zip' : 'Download'),
      run: () => multi ? downloadEntries(names) : f.isDir ? zipViaFetch(names) : downloadFile(f.path),

    if (!multi && !f.isDir && isHeic(f.name)) items.push({ label: 'Download as JPEG', run: () => downloadJpeg(f.path) });
    if (multi) items.push({ label: `Download ${names.length} as one zip`, run: () => zipViaFetch(names) });
    if (!multi && !f.isDir && isImageFile(f.name)) items.push({ label: 'Copy image', run: () => copyImage(f.path, thumbElFor(f.path)) });
    if (!multi && !f.isDir) items.push({ label: 'Copy link', run: () => copyText(location.origin + fileUrl(f.path)) });

  function thumbElFor(p){ return document.querySelector(`[data-path="${CSS.escape(p)}"] [data-role="thumb-media"]`); }

    api('/api/folders').then(r => r.json()).then(folders => {
      const items = [{ head: 'Move to' }];

      for (const dir of folders){
        if (dir === state.path) continue;

        items.push({ label: dir, run: () => moveTo(names, dir) });

      items.push('-', { label: 'New folder here…', run: () => newFolder().then(name => { if (name) moveTo(names, state.path ? state.path + '/' + name : name); }) });

    }).catch(() => toast('Could not load folders'));
  }

  function bgMenu(){
    const items = [{ label: 'New folder…', run: () => newFolder() }, { label: 'Upload files…', run: () => fileInput.click() }];
    if (canPickFolder) items.push({ label: 'Upload a folder…', run: () => folderInput.click() });
    if (state.path) items.push({ label: 'Go up', run: () => goToFolder(state.path.split('/').slice(0, -1).join('/')) });
    items.push('-', { label: 'Select all', run: () => { for (const f of filteredFiles()) state.sel[f.path] = true; renderSel(); } });
    if (selectedNames().length) items.push({ label: 'Clear selection', run: () => { state.sel = {}; renderSel(); } });

  }

  function openCtxAt(target, x, y){
    const card = target.closest && target.closest('[data-path]');

  const filesCol = document.querySelector('.files-col');

  });

    filesCol.addEventListener(ev, () => { clearTimeout(pressTimer); pressTimer = null; }, { passive: true }));

  const listRowsEl = document.getElementById('listRows');
  const swipeBg = document.createElement('div'); swipeBg.className = 'swipe-bg'; document.getElementById('listView').appendChild(swipeBg); // outside #listRows, which renderFiles rewrites
  const SWIPE_COMMIT = 96;
  let sw = null; // { row, f, x0, y0, dx, axis }
  listRowsEl.addEventListener('touchstart', (e) => {
    const row = e.target.closest('.file-row');
    if (!row || e.touches.length !== 1) return;
    const f = entryAt(row.dataset.path);
    if (!f) return;
    sw = { row, f, x0: e.touches[0].clientX, y0: e.touches[0].clientY, dx: 0, axis: null };
  }, { passive: true });

    if (!sw) return;
    const dx = e.touches[0].clientX - sw.x0, dy = e.touches[0].clientY - sw.y0;
    if (!sw.axis){ if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return; sw.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; }
    if (sw.axis !== 'x') return;
    sw.dx = dx;
    const dir = dx > 0 ? 'get' : 'del';
    if (dir === 'del' && sw.f.isDir){ sw.dx = 0; } // folder delete stays behind its confirm dialog
    sw.row.style.transition = 'none';
    sw.row.style.transform = `translateX(${sw.dx}px)`;
    swipeBg.className = 'swipe-bg ' + dir;
    swipeBg.textContent = dir === 'get' ? (Math.abs(sw.dx) >= SWIPE_COMMIT ? 'Release to get' : 'Get') : (Math.abs(sw.dx) >= SWIPE_COMMIT ? 'Release to delete' : 'Delete');
    swipeBg.style.top = sw.row.offsetTop + 'px'; swipeBg.style.height = sw.row.offsetHeight + 'px';

    if (!sw) return;

    row.style.transform = '';

  listRowsEl.addEventListener('touchcancel', endSwipe, { passive: true });

  document.addEventListener('click', (e) => {

  }, true);
  window.addEventListener('resize', closeCtx);
  document.addEventListener('scroll', closeCtx, true);

  document.getElementById('newFolderBtn').addEventListener('click', () => newFolder());

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const folderInput = document.getElementById('folderInput');

  const canPickFolder = 'webkitdirectory' in folderInput && !/iPhone|iPad|Android/.test(navigator.userAgent);
  const pickFolderBtn = document.getElementById('pickFolderBtn');
  if (!canPickFolder) pickFolderBtn.style.display = 'none';

  dropzone.addEventListener('click', (e) => { if (!e.target.closest('#pickFolderBtn')) fileInput.click(); });
  document.getElementById('uploadBtn').addEventListener('click', () => fileInput.click());
  pickFolderBtn.addEventListener('click', () => folderInput.click());

  function itemsFromDrop(dt){

      if (entry.isFile) return entry.file(f => { out.push({ file: f, dir }); resolve(); }, resolve);
      const reader = entry.createReader();
      const sub = joinPath(dir, entry.name);

      const batch = () => reader.readEntries(list => {
        if (!list.length) return resolve();
        Promise.all(list.map(e => read(e, sub))).then(batch, resolve);

  // from inside the app and files dragged in from the desktop.

    el.addEventListener('dragover', (e) => {

      setView('files');

  document.addEventListener('paste', e => {

    const files = Array.from(cd.files || []);

      textInput.focus();

  let queueIdSeq = 1;
  // Takes plain Files, or { file, dir } from a dropped folder. A File picked through
  // webkitdirectory already carries its own path, so both routes end up in the same shape.
  function enqueueFiles(list, dest){

    if (!items.length) return;

    const base = dest === undefined ? state.path : dest;

    renderStats();
    pumpQueue();
  }

  const MAX_CONCURRENT = 1;
  function pumpQueue(){
    const uploading = state.queue.filter(t => t.status === 'uploading').length;

  // Pieces, not one POST: after a drop, a pause or Safari backgrounding, ask the PC how much
  // arrived and send only the rest. The id comes from the file itself, so re-adding the same
  // file after a reload picks up its .part too.
  const CHUNK = 8 * 1024 * 1024;
  function uploadIdFor(file, dest){
    const s = [deviceId, dest, file.name, file.size, file.lastModified].join('|');
    let a = 0x811c9dc5, b = 7;
    for (let i = 0; i < s.length; i++){ const c = s.charCodeAt(i); a = Math.imul(a ^ c, 16777619) >>> 0; b = (Math.imul(b, 31) + c) >>> 0; }

  // with a camera roll queued, that kept the page busy for most of the upload. A quarter-second
  // is smooth enough for a bar. setTimeout, not requestAnimationFrame: rAF stops in a background
  // tab, and the % in the tab title is there for exactly that case.
  let progressTimer = null;

  }
  function sendChunk(task, offset){

    const xhr = new XMLHttpRequest();

    xhr.setRequestHeader('X-Device-Id', deviceId);

        task.loaded = f.size;
        if (j.duplicate) noteDuplicate(f.name);

        // once a second - re-fetching and redrawing the whole folder after every photo was the
        // biggest cost of a camera-roll upload on the phone doing it.
        if (!live || !activeUploads()) refreshFiles();
        cleanupQueue();
        renderProgressSoon();
        pumpQueue();
        return;

      if (xhr.status === 200 && typeof j.size === 'number'){ task.busyRetries = 0; return sendChunk(task, j.size); }

      if (xhr.status === 409 && typeof j.size === 'number' && task.busyRetries++ < 20) return setTimeout(() => sendChunk(task, j.size), 500);
      // The disk won't hold the rest: retrying can't help until someone frees space.
      if (xhr.status === 507) return failTask(task, `Not enough space on the PC (${fmtSize(j.freeBytes)} free)`);
      failTask(task);

  // Re-sending a camera roll can skip hundreds of files: one toast for the lot, not one each.
  let dupCount = 0, dupTimer = null;
  function noteDuplicate(name){
    dupCount++;
    clearTimeout(dupTimer);
    dupTimer = setTimeout(() => {

  let failToast = null;
  function failTask(task, msg){

    pumpQueue();

  function pauseTask(id){
    const t = state.queue.find(t => t.id === id);

    if (t.xhr) t.xhr.abort();

  }
  function resumeTask(id){
    const t = state.queue.find(t => t.id === id);
    if (!t || (t.status !== 'paused' && t.status !== 'error')) return;
    t.status = 'queued'; // progress stays: startUpload asks the PC how much it already has

    pumpQueue();
  }
  function cancelTask(id){
    const t = state.queue.find(t => t.id === id);

    // Drop finished/errored entries after a short delay so the user can see the result first.
    setTimeout(() => {
      state.queue = state.queue.filter(t => !(t.status === 'done'));
      renderProgressSoon();
    }, 2500);
  }

  document.getElementById('pauseAllBtn').addEventListener('click', () => {
    state.queue.filter(t => t.status === 'uploading').forEach(t => pauseTask(t.id));

  function queueCardHtml(t){
    const pct = t.total ? Math.round((t.loaded / t.total) * 100) : 0;
    if (t.status === 'queued'){
      return `
        <div class="transfer-card" data-id="${t.id}">
          <div class="transfer-top">
            <div class="transfer-name queued">${escapeHtml(t.file.name)}</div>
            <div class="transfer-pct queued">Queued</div>
          </div>
          <div class="meter" style="margin-top:10px;"><div class="meter-fill" style="width:0%"></div></div>
          <div class="transfer-sub-row"><span></span><button class="mini-btn danger" data-role="cancel">Cancel</button></div>
        </div>`;
    }
    if (t.status === 'paused'){
      return `
        <div class="transfer-card" data-id="${t.id}">
          <div class="transfer-top">
            <div class="transfer-name">${escapeHtml(t.file.name)}</div>
            <div class="transfer-pct">${pct}%</div>
          </div>
          <div class="meter" style="margin-top:10px;"><div class="meter-fill" style="width:${pct}%; background:var(--muted-2);"></div></div>
          <div class="transfer-sub-row"><span class="transfer-sub" style="margin:0;">Paused</span><span style="display:flex; gap:10px;"><button class="mini-btn" data-role="resume">Resume</button><button class="mini-btn danger" data-role="cancel">Cancel</button></span></div>
        </div>`;
    }
    if (t.status === 'error'){
      return `
        <div class="transfer-card" data-id="${t.id}">
          <div class="transfer-top">
            <div class="transfer-name">${escapeHtml(t.file.name)}</div>
            <div class="transfer-pct" style="color:var(--danger);">Failed</div>
          </div>
          <div class="transfer-sub-row"><span></span><span style="display:flex; gap:10px;"><button class="mini-btn" data-role="resume">Retry</button><button class="mini-btn danger" data-role="cancel">Dismiss</button></span></div>
        </div>`;
    }
    if (t.status === 'done'){
      return `
        <div class="transfer-card" data-id="${t.id}">
          <div class="transfer-top">
            <div class="transfer-name">${escapeHtml(t.file.name)}</div>
            <div class="transfer-pct">Done</div>
          </div>
          <div class="meter" style="margin-top:10px;"><div class="meter-fill" style="width:100%"></div></div>
        </div>`;
    }
    // uploading
    const elapsed = (Date.now() - (t.startedAt || Date.now())) / 1000;
    const rate = elapsed > 1 ? (t.loaded - (t.startLoaded || 0)) / elapsed : 0;
    const eta = rate ? fmtEta((t.total - t.loaded) / rate) : '';
    return `
      <div class="transfer-card" data-id="${t.id}">
        <div class="transfer-top">
          <div class="transfer-name">${escapeHtml(t.file.name)}</div>
          <div class="transfer-pct">${pct}%</div>
        </div>
        <div class="meter" style="margin-top:10px;"><div class="meter-fill" style="width:${pct}%"></div></div>
        <div class="transfer-sub-row"><span class="transfer-sub" style="margin:0;">${fmtSize(t.loaded)} / ${fmtSize(t.total)}${rate ? ' · ' + fmtSize(rate) + '/s' : ''}${eta ? ' · ' + eta : ''}</span><button class="mini-btn" data-role="pause">Pause</button></div>
      </div>`;
  }

  function renderQueue(){
    const panel = document.getElementById('queuePanel');

    if (!state.queue.length){ panel.style.display = 'none'; list.innerHTML=''; return; }
    panel.style.display = 'block';
    list.innerHTML = state.queue.map(queueCardHtml).join('');
    list.querySelectorAll('.transfer-card').forEach(card => {
      const id = Number(card.dataset.id);
      const pauseBtn = card.querySelector('[data-role="pause"]');
      const resumeBtn = card.querySelector('[data-role="resume"]');
      const cancelBtn = card.querySelector('[data-role="cancel"]');
      if (pauseBtn) pauseBtn.addEventListener('click', () => pauseTask(id));
      if (resumeBtn) resumeBtn.addEventListener('click', () => resumeTask(id));
      if (cancelBtn) cancelBtn.addEventListener('click', () => cancelTask(id));

    if (state.view === 'transfers') renderTransfersPage();

  function sendText(){
    const text = textInput.value.trim();

    apiJson('/api/clipboard', 'POST', { text }).then(res => {
      if (res.ok){ textInput.value = ''; refreshClipboard(); }
      else toast('Could not send text');

  function clipItemHtml(item){

  function wireClipItems(container){
    container.querySelectorAll('.clip-item').forEach(el => {
      const id = el.dataset.id;
      el.addEventListener('click', (e) => {
        if (e.target.closest('[data-role="del-clip"]')) return;

        const item = state.clipboard.find(c => c.id === id);

      const del = el.querySelector('[data-role="del-clip"]');
      if (del) del.addEventListener('click', (e) => {

  // ---------- mobile nav wiring ----------

  // ---------- data refresh ----------
  let filesSig = null;
  let knownNames = null; // null until the first listing, so a fresh page load doesn't announce every file
  function announceArrivals(files){
    if (knownNames){
      const fresh = files.filter(f => !knownNames.has(f.path) && f.addedBy !== deviceName && Date.now() - f.mtime < 120000);
      if (fresh.length) arrived(fresh, []);
    }
    knownNames = new Set(files.map(f => f.path));
  }

  // What other devices sent: a toast you can act on, or, while the tab is in the background,
  // a count in the title and on the app icon, told in one toast when you come back.
  let missedFiles = [], missedClips = [];
  function arrived(files, clips){
    if (document.hidden){
      missedFiles.push(...files); missedClips.push(...clips);
      unseen += files.length + clips.length;
      renderTitle();
      if (navigator.setAppBadge) navigator.setAppBadge(unseen).catch(() => {});
      return;
    }
    if (files.length){
      const one = files.length === 1 && files[0];
      toast(one ? `${one.addedBy} sent ${one.name}` : `${files[0].addedBy} sent ${files.length} files`, 6000,
        { label: one && (isPreviewable(one.name) || isOpenable(one.name)) ? 'View' : 'Show', run: () => showArrivals(files) });
    }
    if (clips.length > 1) toast(`${clips.length} texts arrived`, 6000, { label: 'Show', run: () => setView('clipboard') });
    else if (clips.length){
      const c = clips[0], text = c.text.trim().replace(/\s+/g, ' ');
      toast(`${c.from}: ${text.length > 60 ? text.slice(0, 60) + '…' : text}`, 8000, { label: 'Copy', run: () => copyText(c.text) });
    }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    const files = missedFiles, clips = missedClips;
    missedFiles = []; missedClips = []; unseen = 0;
    renderTitle();
    if (navigator.clearAppBadge) navigator.clearAppBadge().catch(() => {});
    if (files.length || clips.length) arrived(files, clips);
  });
  // A photo or video opens as a tap would; anything else is picked out in the list, ready for Get.
  function showArrivals(files){
    setView('files');
    const one = files.length === 1 && files[0];
    if (one && (isPreviewable(one.name) || isOpenable(one.name))) return openFile(one.path);
    state.sel = {};
    for (const f of files) state.sel[f.path] = true;
    renderSel();
    const el = document.querySelector(`[data-path="${CSS.escape(files[0].path)}"]`);
    if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  function refreshFiles(){
    // Both may have changed by the time the response lands (another folder, another query).
    const at = state.path, q = state.q.trim();
    const url = q ? '/api/search?q=' + encodeURIComponent(q) : '/api/files?path=' + encodeURIComponent(at);
    return api(url).then(r => {
      if (r.status === 404){ setOffline(false); if (at){ toast('That folder is gone'); navigate(''); } return null; }
      return r.json();
    }).then(files => {
      if (!files || state.path !== at || state.q.trim() !== q) return;
      if (!q) announceArrivals(files); // search results aren't "what's in this folder", so they can't tell what's new
      state.files = files;
      // The 4s poll used to re-render the whole list every tick, which reloaded every
      // image/video thumbnail and made them flicker. Only redraw when the listing really
      // changed - plus once a minute, so the "3m ago" column doesn't go stale.
      const sig = JSON.stringify(files) + '|' + Math.floor(Date.now() / 60000);
      setOffline(false);
      if (sig === filesSig) return;
      filesSig = sig;
      renderFiles();
      renderNav();
    }).catch(() => setOffline(true));
  }
  function refreshDevices(){
    return api('/api/devices').then(r => r.json()).then(devices => {
      state.devices = devices;
      renderPairCard();
      renderConnPill();
      renderNav();
      if (state.view === 'devices') renderPage();
    }).catch(() => {});
  }
  let clipSig = null;
  let knownClips = null; // as knownNames: what's there at page load isn't news
  function refreshClipboard(){
    return api('/api/clipboard').then(r => r.json()).then(items => {
      const sig = JSON.stringify(items);
      if (sig === clipSig) return;
      clipSig = sig;
      const fresh = knownClips ? items.filter(c => !knownClips.has(c.id) && c.from !== deviceName) : [];
      knownClips = new Set(items.map(c => c.id));
      if (fresh.length) arrived([], fresh);
      state.clipboard = items;
      renderClipSidebar();
      renderNav();
      if (state.view === 'clipboard') renderPage();
    }).catch(() => {});
  }
  function refreshStats(){
    return api('/api/stats').then(r => r.json()).then(s => {
      state.stats = s;
      renderStats();
      renderDisk();
    }).catch(() => {});
  }
  function ping(){
    apiJson('/api/devices/ping', 'POST', { name: deviceName }).then(res => {
      if (res.body && res.body.isHost){
        if (!state.isHost){
          state.isHost = true; deviceName = res.body.name; if (state.view !== 'files') renderPage();
          renderPairCard();
          api('/api/server-info').then(r => r.json()).then(info => { if (info.networkWarning) toast(info.networkWarning, 20000); }).catch(() => {});
        }
        return;
      }
      if (!(res.body && res.body.reset)) return;
      // Someone forgot this device from another device. Take a fresh identity so the
      // entry they removed stays removed.
      deviceId = genId();
      localStorage.setItem('ls_device_id', deviceId);
      ping();
      refreshDevices();
    }).catch(() => {});
  }

  document.getElementById('reachUrl').textContent = location.host;

  // initial load
  renderNav();
  renderCrumbs();
  renderViewVisibility();
  ping();
  refreshFiles();
  refreshDevices();
  refreshClipboard();
  refreshStats();

  // ---------- live updates ----------
  // The server holds this stream open and writes to it the moment anything changes, so a
  // photo sent from the phone appears here at once instead of up to a poll away. The polls
  // below stay as the fallback for when the stream can't be established.
  let live = false;
  (function connectEvents(){
    if (!window.EventSource) return;
    const es = new EventSource('/api/events');
    es.onopen = () => { live = true; setOffline(false); };
    es.onmessage = (e) => {
      const kinds = String(e.data).split(',');
      if (kinds.includes('files')) refreshFiles();
      if (kinds.includes('clip')) refreshClipboard();
      if (kinds.includes('devices')) refreshDevices();
    };
    es.onerror = () => { live = false; }; // EventSource reconnects on its own
  })();

  // Don't poll a backgrounded tab: on a phone in your pocket that was four requests
  // every few seconds forever, and it kept the device showing as "online".
  function poll(fn, ms){ setInterval(() => { if (!document.hidden) fn(); }, ms); }
  poll(ping, 8000);
  poll(refreshDevices, 5000); // no event says a device went quiet - only the clock does
  poll(refreshStats, 2000);
  poll(() => { if (!live) refreshFiles(); }, 4000);
  poll(() => { if (!live) refreshClipboard(); }, 5000);
  poll(refreshFiles, 30000);  // even when live: keeps the "3m ago" column from going stale

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    ping(); refreshFiles(); refreshDevices(); refreshClipboard(); refreshStats();
  });
})();
</script>
</body>
</html>
