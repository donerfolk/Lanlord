name: release

# Push a tag like v1.0.0 to build the Windows zip and publish it as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node selftest.js
      - name: Build zip
        shell: pwsh
        run: |
          $out = "Lanlord-$env:GITHUB_REF_NAME-windows"
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item server.js, certs.js, install-service.js, uninstall-service.js, package.json, LICENSE, public, node_modules -Destination $out -Recurse
          Copy-Item release/*.cmd $out
          Copy-Item (Get-Command node).Source $out
          Compress-Archive $out "$out.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "Lanlord-$env:GITHUB_REF_NAME-windows.zip" --generate-notes
